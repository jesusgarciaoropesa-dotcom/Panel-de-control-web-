<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Panel de Control · Multicanal (demo)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      /* ===== Sistema de diseño Modernist (tokens) ===== */
      :root {
        --bg: #f3f2f2;
        --surface: #ffffff;
        --text: #201e1d;
        --n100: oklch(0.97 0.002 60);
        --n200: oklch(0.92 0.003 60);
        --n300: oklch(0.85 0.003 60);
        --n500: oklch(0.62 0.005 60);
        --n600: oklch(0.52 0.006 60);
        --n700: oklch(0.42 0.006 60);
        --n800: oklch(0.32 0.006 50);
        --accent: #ec3013;
        --accent-600: oklch(0.55 0.221 30);
        --positive: oklch(0.58 0.14 150);
        --font: 'Archivo', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        --s1: 4px;
        --s2: 8px;
        --s3: 12px;
        --s4: 16px;
        --s6: 24px;
        --s8: 32px;
        --rule: 2px;
        --divider: 1px;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #171615;
          --surface: #201e1d;
          --text: #f3f2f2;
          --n100: oklch(0.28 0.004 60);
          --n200: oklch(0.34 0.004 60);
          --n300: oklch(0.42 0.004 60);
          --n500: oklch(0.6 0.005 60);
          --n600: oklch(0.68 0.006 60);
          --n700: oklch(0.78 0.006 60);
          --n800: oklch(0.9 0.006 50);
        }
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        border-radius: 0;
      }
      body {
        font-family: var(--font);
        font-size: 14px;
        color: var(--text);
        background: var(--bg);
        -webkit-font-smoothing: antialiased;
      }
      button {
        font-family: inherit;
        cursor: pointer;
        border: none;
        background: none;
        color: inherit;
      }
      .tnum {
        font-variant-numeric: tabular-nums;
      }

      /* ===== Nav ===== */
      .nav {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: var(--s4);
        padding: var(--s4) var(--s8);
        background: var(--surface);
        border-bottom: var(--rule) solid var(--text);
        flex-wrap: wrap;
      }
      .brand {
        display: flex;
        align-items: baseline;
        gap: var(--s2);
      }
      .brand__mark {
        font-size: 22px;
        font-weight: 700;
        color: var(--accent);
        line-height: 1;
      }
      .brand__name {
        font-size: 16px;
        font-weight: 700;
        letter-spacing: -0.01em;
        text-transform: uppercase;
      }
      .controls {
        display: flex;
        align-items: center;
        gap: var(--s4);
      }
      .segmented {
        display: inline-flex;
        border: var(--rule) solid var(--text);
      }
      .segmented button {
        font-size: 12px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        padding: var(--s2) var(--s3);
        color: var(--text);
        background: var(--surface);
      }
      .segmented button + button {
        border-left: var(--rule) solid var(--text);
      }
      .segmented button[aria-pressed='true'] {
        background: var(--text);
        color: var(--surface);
      }
      .live {
        display: inline-flex;
        align-items: center;
        gap: var(--s2);
        font-size: 12px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: var(--n600);
      }
      .live__dot {
        width: 8px;
        height: 8px;
        background: var(--accent);
        animation: pulse 1.6s ease-in-out infinite;
      }
      .live.on {
        color: var(--accent-600);
      }
      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
          transform: scale(1);
        }
        50% {
          opacity: 0.35;
          transform: scale(0.8);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .live__dot {
          animation: none;
        }
      }

      /* ===== Contenido ===== */
      .content {
        width: 100%;
        max-width: 1200px;
        margin: 0 auto;
        padding: var(--s6) var(--s8) var(--s8);
        display: flex;
        flex-direction: column;
        gap: var(--s6);
      }
      .head h1 {
        font-size: 22px;
        font-weight: 700;
        letter-spacing: -0.01em;
      }
      .head p {
        font-size: 14px;
        color: var(--n600);
        margin-top: var(--s2);
      }

      .kpi-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: var(--s4);
      }
      .hr {
        height: var(--rule);
        border: none;
        background: var(--text);
      }
      .channel-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: var(--s4);
      }

      /* ===== Tarjeta KPI ===== */
      .kpi {
        background: var(--surface);
        border: var(--divider) solid var(--n200);
        padding: var(--s4);
        display: flex;
        flex-direction: column;
        gap: var(--s3);
      }
      .kpi__head {
        display: flex;
        align-items: center;
        gap: var(--s2);
        color: var(--n600);
      }
      .kpi__label {
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }
      .kpi__value {
        font-size: 30px;
        font-weight: 700;
        line-height: 1;
      }

      /* ===== Variación ===== */
      .trend {
        display: inline-flex;
        align-items: center;
        gap: var(--s1);
        font-size: 12px;
        font-weight: 500;
        line-height: 1;
      }
      .trend.up {
        color: var(--positive);
      }
      .trend.down {
        color: var(--accent);
      }
      .trend .cap {
        color: var(--n500);
        font-weight: 400;
        margin-left: var(--s1);
      }

      /* ===== Tarjeta de canal ===== */
      .card {
        background: var(--surface);
        border: var(--divider) solid var(--n200);
        padding: var(--s4);
        display: flex;
        flex-direction: column;
        gap: var(--s4);
        min-height: 200px;
      }
      .card__header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: var(--s3);
      }
      .card__titlegroup {
        display: flex;
        align-items: center;
        gap: var(--s2);
      }
      .card__title {
        font-size: 18px;
        font-weight: 600;
        line-height: 1.1;
      }
      .tag {
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        padding: var(--s1) var(--s2);
        line-height: 1;
      }
      .tag.neutral {
        background: var(--n100);
        color: var(--n700);
        border: var(--divider) solid var(--n200);
      }
      .tag.accent {
        background: var(--accent);
        color: #fff;
      }
      .card__primary {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: var(--s4);
      }
      .card__plabel {
        font-size: 12px;
        font-weight: 500;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: var(--n600);
        margin-bottom: var(--s2);
      }
      .card__pvalue {
        font-size: 34px;
        font-weight: 700;
        line-height: 1;
        margin-bottom: var(--s2);
      }
      .stats {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: var(--s3);
        padding-top: var(--s3);
        border-top: var(--divider) solid var(--n200);
      }
      .stat dt {
        font-size: 11px;
        font-weight: 500;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: var(--n500);
      }
      .stat dd {
        font-size: 16px;
        font-weight: 600;
        margin-top: var(--s1);
      }
      .synced {
        font-size: 12px;
        color: var(--n500);
        margin-top: auto;
      }

      /* ===== Notas ===== */
      .notes {
        background: var(--n100);
        border: var(--divider) solid var(--n200);
        padding: var(--s4);
        display: flex;
        flex-direction: column;
        gap: var(--s4);
      }
      .notes__header {
        display: flex;
        align-items: center;
        gap: var(--s2);
      }
      .notes__header h3 {
        font-size: 18px;
        font-weight: 600;
      }
      .notes ul {
        list-style: none;
        display: flex;
        flex-direction: column;
        gap: var(--s3);
      }
      .notes li {
        position: relative;
        padding-left: var(--s4);
        line-height: 1.45;
        color: var(--n800);
      }
      .notes li::before {
        content: '';
        position: absolute;
        left: 0;
        top: 0.5em;
        width: 6px;
        height: 6px;
        background: var(--accent);
      }

      svg.icon {
        display: block;
        flex-shrink: 0;
      }

      @media (max-width: 900px) {
        .kpi-grid {
          grid-template-columns: repeat(2, 1fr);
        }
        .channel-grid {
          grid-template-columns: 1fr;
        }
        .content {
          padding: var(--s6) var(--s4);
        }
        .nav {
          padding: var(--s4);
        }
      }
      @media (max-width: 560px) {
        .kpi-grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <nav class="nav">
      <div class="brand">
        <span class="brand__mark">/</span>
        <span class="brand__name">Panel de Control</span>
      </div>
      <div class="controls">
        <div class="segmented" role="group" aria-label="Periodo">
          <button data-period="7d" aria-pressed="true">7 días</button>
          <button data-period="30d" aria-pressed="false">30 días</button>
        </div>
        <div class="live" id="live" aria-live="polite">
          <span class="live__dot"></span>
          <span id="live-icon"></span>
          <span id="live-label">En vivo</span>
        </div>
      </div>
    </nav>

    <main class="content">
      <div class="head">
        <h1 id="title">Resumen · Últimos 7 días</h1>
        <p>Todas tus métricas de audiencia e ingresos en una sola vista.</p>
      </div>
      <div class="kpi-grid" id="kpis"></div>
      <hr class="hr" />
      <div class="channel-grid" id="channels"></div>
    </main>

    <script>
      // ===== Iconos (SVG lucide, dibujados inline; sin depender de internet) =====
      const P = {
        'at-sign':
          '<circle cx="12" cy="12" r="4"/><path d="M16 8v5a3 3 0 0 0 6 0v-1a10 10 0 1 0-3.92 7.94"/>',
        'thumbs-up':
          '<path d="M7 10v12"/><path d="M15 5.88 14 10h5.83a2 2 0 0 1 1.92 2.56l-2.33 8A2 2 0 0 1 17.5 22H4a2 2 0 0 1-2-2v-8a2 2 0 0 1 2-2h2.76a2 2 0 0 0 1.79-1.11L12 2a3.13 3.13 0 0 1 3 3.88Z"/>',
        'bar-chart-3':
          '<path d="M3 3v18h18"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/>',
        'dollar-sign':
          '<line x1="12" y1="2" x2="12" y2="22"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>',
        'shopping-cart':
          '<circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"/>',
        lightbulb:
          '<path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"/><path d="M9 18h6"/><path d="M10 22h4"/>',
        'trending-up':
          '<polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/>',
        'trending-down':
          '<polyline points="22 17 13.5 8.5 8.5 13.5 2 7"/><polyline points="16 17 22 17 22 11"/>',
        activity: '<polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>',
        heart:
          '<path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.29 1.49 4.04 3 5.5l7 7Z"/>',
        users:
          '<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',
      };
      function icon(name, size = 16, color = 'currentColor') {
        return (
          '<svg class="icon" width="' +
          size +
          '" height="' +
          size +
          '" viewBox="0 0 24 24" fill="none" stroke="' +
          color +
          '" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
          (P[name] || '') +
          '</svg>'
        );
      }

      // ===== Formato es-ES =====
      const nf = new Intl.NumberFormat('es-ES');
      const cf = new Intl.NumberFormat('es-ES', {
        style: 'currency',
        currency: 'EUR',
        maximumFractionDigits: 2,
      });
      const pf = new Intl.NumberFormat('es-ES', { maximumFractionDigits: 1 });
      const compact = (n) =>
        n >= 1e6
          ? pf.format(n / 1e6) + ' M'
          : n >= 1e3
            ? pf.format(n / 1e3) + ' K'
            : nf.format(Math.round(n));
      const integer = (n) => nf.format(Math.round(n));
      const currency = (n) => cf.format(n);
      const percent = (n) => pf.format(n) + ' %';
      const duration = (s) =>
        Math.floor(s / 60) + 'm ' + String(Math.round(s % 60)).padStart(2, '0') + 's';
      const signed = (n) => (n > 0 ? '+' : '') + pf.format(n) + ' %';

      // ===== Datos de demostración (mismo cálculo que el backend) =====
      const wob = (b, a = 0.02) => b * (1 + (Math.random() - 0.5) * 2 * a);
      function figures(period) {
        const scale = period === '30d' ? 4.1 : 1;
        return {
          ig: { followers: wob(18420), reach: wob(52300 * scale), er: wob(4.8), posts: period === '30d' ? 18 : 5 },
          fb: { followers: wob(9650), reach: wob(31200 * scale), er: wob(2.9), posts: period === '30d' ? 14 : 4 },
          ga: { sessions: wob(24800 * scale), pv: wob(68400 * scale), dur: wob(163), bounce: wob(42.6) },
          ads: { earnings: wob((period === '30d' ? 1284 : 312)), rpm: wob(4.62), clicks: wob(1840 * scale), impr: wob(276000 * scale) },
          amz: { commissions: wob((period === '30d' ? 486 : 118)), clicks: wob(2140 * scale), conv: wob(3.4), orders: wob(74 * scale) },
        };
      }
      function series(period, base) {
        const days = period === '30d' ? 30 : 7;
        const pts = [];
        for (let i = 0; i < days; i++) pts.push(base * (1 + i * 0.01) * (0.82 + Math.random() * 0.36));
        return pts;
      }

      // ===== Sparkline SVG =====
      function spark(points, w = 160, h = 48) {
        if (points.length < 2) return '';
        const pad = 4,
          iw = w - pad * 2,
          ih = h - pad * 2;
        const min = Math.min(...points),
          max = Math.max(...points),
          span = max - min || 1;
        const co = points.map((p, i) => [pad + (i / (points.length - 1)) * iw, pad + (1 - (p - min) / span) * ih]);
        const d = co.map(([x, y], i) => (i ? 'L' : 'M') + x.toFixed(1) + ' ' + y.toFixed(1)).join(' ');
        const [ex, ey] = co[co.length - 1];
        return (
          '<svg width="' + w + '" height="' + h + '" viewBox="0 0 ' + w + ' ' + h + '" aria-hidden="true">' +
          '<path d="' + d + '" fill="none" stroke="var(--n800)" stroke-width="2" stroke-linecap="square"/>' +
          '<circle cx="' + ex.toFixed(1) + '" cy="' + ey.toFixed(1) + '" r="3" fill="var(--accent)"/></svg>'
        );
      }

      function trend(pct, cap) {
        const dir = pct > 0 ? 'up' : pct < 0 ? 'down' : 'flat';
        const ic = pct >= 0 ? 'trending-up' : 'trending-down';
        return (
          '<span class="trend ' + dir + '">' + icon(ic, 14) +
          '<span class="tnum">' + signed(pct) + '</span>' +
          (cap ? '<span class="cap">' + cap + '</span>' : '') + '</span>'
        );
      }

      function kpiCard(name, label, value, pct) {
        return (
          '<div class="kpi"><div class="kpi__head">' + icon(name, 16) +
          '<span class="kpi__label">' + label + '</span></div>' +
          '<div class="kpi__value tnum">' + value + '</div>' +
          trend(pct, 'vs. periodo anterior') + '</div>'
        );
      }

      function channelCard(cfg) {
        const stats = cfg.stats
          .map((s) => '<div class="stat"><dt>' + s[0] + '</dt><dd class="tnum">' + s[1] + '</dd></div>')
          .join('');
        return (
          '<section class="card"><header class="card__header"><div class="card__titlegroup">' +
          icon(cfg.icon, 20) + '<h3 class="card__title">' + cfg.title + '</h3></div>' +
          '<span class="tag ' + cfg.tagType + '">' + cfg.tag + '</span></header>' +
          '<div class="card__primary"><div><div class="card__plabel">' + cfg.plabel + '</div>' +
          '<div class="card__pvalue tnum">' + cfg.pvalue + '</div>' + trend(cfg.pct) + '</div>' +
          spark(cfg.series) + '</div>' +
          '<dl class="stats">' + stats + '</dl>' +
          '<footer class="synced">Actualizado ahora</footer></section>'
        );
      }

      let period = '7d';

      function render() {
        const f = figures(period);
        document.getElementById('title').textContent =
          'Resumen · ' + (period === '7d' ? 'Últimos 7 días' : 'Últimos 30 días');

        const totalRev = f.ads.earnings + f.amz.commissions;
        const totalAud = f.ig.followers + f.fb.followers;
        const totalInt = f.ig.reach * (f.ig.er / 100) + f.fb.reach * (f.fb.er / 100);

        document.getElementById('kpis').innerHTML =
          kpiCard('dollar-sign', 'Ingresos totales', currency(totalRev), 5.4) +
          kpiCard('users', 'Audiencia total', compact(totalAud), 1.8) +
          kpiCard('bar-chart-3', 'Visitas al sitio', compact(f.ga.sessions), 6.1) +
          kpiCard('heart', 'Interacciones totales', compact(totalInt), 3.2);

        const cards = [
          {
            icon: 'at-sign', title: 'Instagram', tag: 'Social', tagType: 'neutral',
            plabel: 'Seguidores', pvalue: compact(f.ig.followers), pct: 2.4,
            stats: [['Alcance', compact(f.ig.reach)], ['Interacción', percent(f.ig.er)], ['Posts', integer(f.ig.posts)]],
            series: series(period, f.ig.reach / 7),
          },
          {
            icon: 'thumbs-up', title: 'Facebook', tag: 'Social', tagType: 'neutral',
            plabel: 'Seguidores', pvalue: compact(f.fb.followers), pct: 0.9,
            stats: [['Alcance', compact(f.fb.reach)], ['Interacción', percent(f.fb.er)], ['Posts', integer(f.fb.posts)]],
            series: series(period, f.fb.reach / 7),
          },
          {
            icon: 'bar-chart-3', title: 'Google Analytics', tag: 'Web', tagType: 'neutral',
            plabel: 'Sesiones', pvalue: compact(f.ga.sessions), pct: 6.1,
            stats: [['Páginas vistas', compact(f.ga.pv)], ['Duración', duration(f.ga.dur)], ['Rebote', percent(f.ga.bounce)]],
            series: series(period, f.ga.sessions / 7),
          },
          {
            icon: 'dollar-sign', title: 'Google AdSense', tag: 'Ingresos', tagType: 'accent',
            plabel: 'Ingresos', pvalue: currency(f.ads.earnings), pct: 8.2,
            stats: [['RPM', currency(f.ads.rpm)], ['Clics', integer(f.ads.clicks)], ['Impresiones', compact(f.ads.impr)]],
            series: series(period, f.ads.earnings / 7),
          },
          {
            icon: 'shopping-cart', title: 'Amazon Afiliados', tag: 'Ingresos', tagType: 'accent',
            plabel: 'Comisiones', pvalue: currency(f.amz.commissions), pct: -3.5,
            stats: [['Clics', integer(f.amz.clicks)], ['Conversión', percent(f.amz.conv)], ['Pedidos', integer(f.amz.orders)]],
            series: series(period, f.amz.commissions / 7),
          },
        ];

        const adsShare = (f.ads.earnings / totalRev) * 100;
        const igVsFb = f.ig.er / f.fb.er;
        const notes =
          '<section class="notes"><div class="notes__header">' + icon('lightbulb', 20) +
          '<h3>Notas rápidas</h3></div><ul>' +
          '<li>AdSense genera el ' + percent(adsShare) + ' de tus ingresos totales este periodo.</li>' +
          '<li>Instagram tiene ' + igVsFb.toFixed(1) + '× más interacción que Facebook — prioriza contenido allí.</li>' +
          '<li>' + (f.ga.bounce > 45
            ? 'El rebote (' + percent(f.ga.bounce) + ') está algo alto; revisa las páginas de entrada.'
            : 'El rebote (' + percent(f.ga.bounce) + ') está en buen rango.') + '</li></ul></section>';

        document.getElementById('channels').innerHTML = cards.map(channelCard).join('') + notes;
      }

      // Icono del indicador "En vivo"
      document.getElementById('live-icon').innerHTML = icon('activity', 14);

      // Selector de periodo
      document.querySelectorAll('.segmented button').forEach((btn) => {
        btn.addEventListener('click', () => {
          period = btn.dataset.period;
          document.querySelectorAll('.segmented button').forEach((b) =>
            b.setAttribute('aria-pressed', String(b === btn)),
          );
          render();
        });
      });

      // "En vivo": cada 3 s re-genera con ligera variación (como el prototipo)
      const live = document.getElementById('live');
      const label = document.getElementById('live-label');
      setInterval(() => {
        live.classList.add('on');
        label.textContent = 'Actualizando';
        render();
        setTimeout(() => {
          live.classList.remove('on');
          label.textContent = 'En vivo';
        }, 700);
      }, 3000);

      render();
    </script>
  </body>
</html>
